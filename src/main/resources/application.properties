# Basic Configuration
spring.application.name=Time Tracker API
server.port=8080
server.servlet.context-path=/api

# Timezone Configuration
spring.jackson.time-zone=America/Sao_Paulo
spring.jackson.date-format=yyyy-MM-dd'T'HH:mm:ss.SSSXXX
spring.jpa.properties.hibernate.jdbc.time_zone=America/Sao_Paulo
user.timezone=America/Sao_Paulo

# DATABASE CONNECTION
# Postgresql Configuration
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5433/time-tracker-digital}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:admin}

# HikariCP Configuration
spring.datasource.hikari.connection-timeout=60000
spring.datasource.hikari.maximum-pool-size=40
spring.datasource.hikari.minimum-idle=20
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1200000
spring.datasource.hikari.validation-timeout=5000
spring.datasource.hikari.connection-test-query=SELECT 1

# JPA/Hibernate Configuration
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate

# INTEGRATION CONNECTIONS
# Email Configuration (Resend SMTP)
spring.mail.host=${SMTP_HOST:smtp.resend.com}
spring.mail.port=${SMTP_PORT:465}
spring.mail.username=${SMTP_USERNAME:resend}
spring.mail.password=${SMTP_PASSWORD:re_MyScCE4i_Dr8pfmdzcjoL9VW1msMw4uAg}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.ssl.enable=true

# Email From Configuration
email.from.name=Time Tracker
email.from.address=${EMAIL_FROM_ADDRESS:timetracker@resend.dev}

# Email Retry Configuration
email.retry.cron=${EMAIL_RETRY_CRON:0 0/30 * * * *}
email.retry.max.attempts=${EMAIL_RETRY_MAX_ATTEMPTS:5}

# Swagger/OpenAPI Configuration
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.packages-to-scan=com.vmarcante.time_tracker.core.interfaces
springdoc.default-produces-media-type=application/json
springdoc.default-consumes-media-type=application/json

# Security Configuration
app.encryption.key=${APP_ENCRYPTION_KEY:time-tracker-digital-default-key-change-in-production}

# Redis Configuration (for Rate Limiting)
redis.enabled=${REDIS_ENABLED:false}
redis.host=${REDIS_HOST:localhost}
redis.port=${REDIS_PORT:6379}
redis.password=${REDIS_PASSWORD:}
redis.database=${REDIS_DATABASE:0}

