# Basic Configuration
spring.application.name=Time Tracker API
server.port=8080
server.servlet.context-path=/api
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=30s

# Timezone Configuration
spring.jackson.time-zone=America/Sao_Paulo
spring.jackson.date-format=yyyy-MM-dd'T'HH:mm:ss.SSSXXX
spring.jpa.properties.hibernate.jdbc.time_zone=America/Sao_Paulo
user.timezone=America/Sao_Paulo

# DATABASE CONNECTION
# Postgresql Configuration
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# HikariCP Configuration
spring.datasource.hikari.connection-timeout=60000
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1200000
spring.datasource.hikari.validation-timeout=5000
spring.datasource.hikari.connection-test-query=SELECT 1

# JPA/Hibernate Configuration
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate

# Flyway Configuration
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.table=TB0000_SQL_HISTORY
spring.flyway.schemas=dbo
spring.flyway.default-schema=dbo

# INTEGRATION CONNECTIONS
# Email Configuration (Resend SMTP)
spring.mail.host=${SMTP_HOST:smtp.resend.com}
spring.mail.port=${SMTP_PORT:465}
spring.mail.username=${SMTP_USERNAME}
spring.mail.password=${SMTP_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.ssl.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# Email From Configuration
email.from.name=Time Tracker
email.from.address=${EMAIL_FROM_ADDRESS}

# Email Retry Configuration
email.retry.cron=${EMAIL_RETRY_CRON:0 0/30 * * * *}
email.retry.max.attempts=${EMAIL_RETRY_MAX_ATTEMPTS:5}

# Swagger/OpenAPI Configuration
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.packages-to-scan=com.vmarcante.time_tracker.core.interfaces
springdoc.default-produces-media-type=application/json
springdoc.default-consumes-media-type=application/json

# Security Configuration
app.encryption.key=${APP_ENCRYPTION_KEY:time-tracker-digital-default-key-change-in-production}
jwt.secret=${JWT_SECRET:change-me-in-production}
app.cookie.secure=${COOKIE_SECURE:true}
app.frontend.url=${APP_FRONTEND_URL:http://localhost:4200}

# Health Check Configuration
health.app-key=${HEALTH_APP_KEY}

# Redis Configuration (for Rate Limiting)
redis.enabled=${REDIS_ENABLED:false}
redis.host=${REDIS_HOST:localhost}
redis.port=${REDIS_PORT:6379}
redis.password=${REDIS_PASSWORD:}
redis.database=${REDIS_DATABASE:0}

