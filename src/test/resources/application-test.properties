# Test profile configuration

# H2 In-Memory Database
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE;INIT=CREATE SCHEMA IF NOT EXISTS dbo
spring.jpa.properties.hibernate.default_schema=dbo
spring.datasource.username=sa
spring.datasource.password=

# JPA/Hibernate
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# Disable SQL initialization
spring.sql.init.mode=never

# Redis disabled
redis.enabled=false

# Email
spring.mail.host=localhost
spring.mail.port=3025
spring.mail.username=test
spring.mail.password=test

email.from.address=test@example.com
email.from.name=Time Tracker Test

# Security keys for tests
app.encryption.key=test-encryption-key-min-32-characters
jwt.secret=test-jwt-secret-min-32-characters
health.app-key=test-health-app-key
app.frontend.url=http://localhost:4200
